langcode: en
status: true
dependencies:
  enforced:
    module:
      - migrate_7x_claw
      - migrate_plus
      - islandora
id: islandora_audit_file
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: islandora_7x
label: 'AUDIT File'
source:
  plugin: islandora
  solr_base_url: 'http://192.168.0.248:8082/solr'
  q: 'PID:"prdn:10002" OR RELS_EXT_isPageOf_uri_ms:"info:fedora/prdn:10002"'
  fedora_base_url: 'http://192.168.0.248:8081/fedora'
  data_fetcher_plugin: http
  authentication:
    plugin: basic
    username: fedoraAdmin
    password: CHANGEME-set-via-migrate_7x_claw-admin-form
  data_parser_plugin: authenticated_xml
  item_selector: '/foxml:digitalObject'
  constants:
    destination_directory: 'fedora://masters'
    mimetype: application/xml
    extension: xml
    dsid: AUDIT
    creator_uid: 1
  fields:
    -
      name: PID
      label: PID
      selector: '@PID'
    -
      name: audit_ds
      label: Audit Datastream
      selector: 'foxml:datastream[@ID = "AUDIT"]/foxml:datastreamVersion/foxml:xmlContent/*'
  ids:
    PID:
      type: string
process:
  digital_id:
    -
      plugin: concat
      delimiter: _
      source:
        - PID
        - constants/dsid
    -
      plugin: str_replace
      search: ':'
      replace: _
  filemime: constants/mimetype
  uid: constants/creator_uid
  filename:
    plugin: concat
    delimiter: .
    source:
      - '@digital_id'
      - constants/extension
  destination:
    plugin: concat
    delimiter: /
    source:
      - constants/destination_directory
      - '@filename'
  uri:
    - plugin: skip_on_empty
      method: row
      message: "Audit file is missing" 
      source: audit_ds
    -
      plugin: flatten
      source:
        - '@destination'
        - audit_ds 
    -
      plugin: file_blob
destination:
  plugin: 'entity:file'
  default_bundle: file 
migration_dependencies:
  required: { }
  optional: { }
